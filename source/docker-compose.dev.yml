services:
  node-app:
    command: ["npm", "run", "dev"]

    environment:
      - WATCHBACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: ./test-app-next
          target: /home/node/app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json


  flask-app:
    ports:
      - '8000:8000'
    command: ["/venv/bin/python3", "-m", "flask", "--app", "main", "run", "--host=0.0.0.0", "--debug", "--port", "8000"]

    environment:
      - WATCHBACK_POLLING=true
      - DATABASE_URL=mysql+mysqlconnector://root:abc@mysql-db:3306/VaseLabDev
      - SECRET_KEY=dev
      - JWT_SECRET_KEY=dev

    post_start:
      - command: /venv/bin/python3 -m flask seed

    develop:
      watch:
        - action: sync
          path: ./test-app-flask
          target: /usr/src/app

  mysql-db:
    environment:
      MYSQL_ROOT_PASSWORD: abc
      MYSQL_DATABASE: VaseLabDev