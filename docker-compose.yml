services:
  node-app:
    build:
      context: ./test-app-next
    user: 'node'
    working_dir: /home/node/app
    ports: # connect port 3000 in the container to port 3000 in the real world
      - '3000:3000'
    depends_on:
      - flask-app
    networks:
      - backend
    # command: ["bash", "start_prod.sh"]
    command: ["npm", "run", "dev"]

    environment:
      - WATCHBACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: ./test-app-next
          target: /home/node/app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json


  flask-app:
    build:
      context: ./test-app-flask
    ports:
      - '8000:8000'
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend
      - db
    volumes:
      - ./test-app-flask:/usr/src/app
    # command: ["/venv/bin/python3", "-m", "gunicorn", "-w", "4", "-b", "0.0.0.0", "main:create_app()"]
    command: ["/venv/bin/python3", "-m", "flask", "--app", "main", "run", "--host=0.0.0.0", "--debug", "--port", "8000"]

    environment:
      - WATCHBACK_POLLING=true
      - DATABASE_URL=mysql+mysqlconnector://root:abc@mysql-db:3306/Test
      - FLASK_APP=main:create_app
    develop:
      watch:
        - action: sync
          path: ./test-app-flask
          target: /usr/src/app
          ignore:
            - node_modules/
            - .next/


  mysql-db:
    build:
      context: ./test-app-db
    environment:
      MYSQL_ROOT_PASSWORD: abc # by god please change this in prod
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3307:3306'
    networks:
      - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pabc"]
      interval: 5s
      timeout: 5s
      retries: 10

# creates a network link between containers
# technically it would also work without it but its good practice
networks:
  backend:
    driver: bridge
  db:
    driver: bridge

volumes:
  db_data: